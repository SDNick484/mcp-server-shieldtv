name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, for the shared-drift job's --latest check (below). A schedule runs the
  # whole workflow, so the other jobs also catch a dependency release that breaks us.
  schedule:
    - cron: "0 8 * * 1"  # Mondays 8:00
      timezone: America/Los_Angeles  # 8 a.m. Pacific all year, across daylight saving
  workflow_dispatch:  # a "Run workflow" button: also runs the --latest check

# The token gets nothing it doesn't need: these jobs only read the checkout.
permissions:
  contents: read

# One run per branch and event. A push to a PR branch cancels that PR's previous run; pushes to main
# and the weekly schedule queue instead, so a merge can't cancel the schedule's --latest check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a commit, not a tag: a tag can be moved. The comment is the version the SHA
# was taken from; Dependabot (.github/dependabot.yml) bumps both together.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/src" -w /src python:3.12-alpine sh deploy/alpine/smoke-test.sh

  shared-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}  # for api.github.com's rate limit; raw files are fetched without it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"  # the oldest supported: keeps the stdlib-only script honest
      - name: Shared files match the locked commit
        run: python scripts/sync_shared.py --check
      - name: Shared files match mcp-server-shared main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/sync_shared.py --check --latest
