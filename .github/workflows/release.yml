name: Release

# Pushing a tag like v0.2.0 builds the package, publishes it to PyPI and makes a GitHub release.
#
# No PyPI token is stored anywhere. PyPI's "trusted publishing" trusts this workflow instead: the
# publish job asks GitHub for a short-lived OIDC token (id-token: write) that says "repo
# SDNick484/mcp-server-shieldtv, workflow release.yml, environment pypi", and PyPI accepts uploads
# only from a token matching the publisher configured on pypi.org. One-time setup is in
# CONTRIBUTING.md ("Releasing").

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Actions are pinned to a commit, not a tag: a tag can be moved. The comment is the version the SHA
# was taken from; Dependabot (.github/dependabot.yml) bumps both together.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The tag must match the package version
        run: |
          version=$(python -c 'import re, pathlib; print(re.search(r"__version__ = \"(.+)\"", pathlib.Path("src/shieldtv_mcp/__init__.py").read_text())[1])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match __version__ $version"; exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # The wheel must install and run on its own (no source tree next to it).
      - run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install "$(ls dist/*.whl)"
          /tmp/v/bin/mcp-server-shieldtv --version
          /tmp/v/bin/python -c "import shieldtv_mcp.server"  # every runtime dependency came with it
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-server-shieldtv/
    permissions:
      id-token: write  # the OIDC token PyPI's trusted publishing checks
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md >notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
