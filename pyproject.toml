[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-shieldtv"
version = "0.1.0"
description = "MCP server for NVIDIA Shield TV (Android TV Remote protocol v2) with a one-time pairing CLI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nicholas E. Andrade" }]
requires-python = ">=3.11"
keywords = ["mcp", "mcp-server", "nvidia-shield", "shield-tv", "android-tv", "home-automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "mcp>=2.3,<3",
    "androidtvremote2>=0.3.2",
    "zeroconf>=0.130",
    "typing_extensions>=4.7",
    "adb-shell[async]>=0.4.4",
    "pyjwt[crypto]>=2.10",   # verifying Cloudflare Access assertions (remote.py)
    "uvicorn>=0.31",         # the HTTP transport (remote.py)
]

[project.urls]
Homepage = "https://github.com/SDNick484/mcp-server-shieldtv"
Issues = "https://github.com/SDNick484/mcp-server-shieldtv/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "mypy>=1.11", "httpx2"]

[project.scripts]
mcp-server-shieldtv = "shieldtv_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["adb_shell.*"]  # ships no type hints
ignore_missing_imports = true
