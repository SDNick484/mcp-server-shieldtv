[build-system]
requires = ["setuptools>=77"]  # 77: SPDX `license` strings (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-shieldtv"
dynamic = ["version"]  # from shieldtv_mcp.__version__ (below)
description = "MCP server for NVIDIA Shield TV (Android TV Remote protocol v2) with a one-time pairing CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas E. Andrade" }]
requires-python = ">=3.11"
keywords = ["mcp", "mcp-server", "nvidia-shield", "shield-tv", "android-tv", "home-automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "mcp>=2.3,<3",
    "androidtvremote2>=0.3.2",
    "zeroconf>=0.130",
    "typing_extensions>=4.7",
    "adb-shell[async]>=0.4.4",
    "pyjwt[crypto]>=2.10",   # verifying Cloudflare Access assertions (remote.py)
    "uvicorn>=0.31",         # the HTTP transport (remote.py)
]

[project.urls]
Homepage = "https://github.com/SDNick484/mcp-server-shieldtv"
Issues = "https://github.com/SDNick484/mcp-server-shieldtv/issues"
Changelog = "https://github.com/SDNick484/mcp-server-shieldtv/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "mypy>=1.11", "httpx2"]

[project.scripts]
mcp-server-shieldtv = "shieldtv_mcp.cli:main"

[tool.setuptools.dynamic]
version = { attr = "shieldtv_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["adb_shell.*", "google.protobuf.*"]  # ship no type hints (protobuf's stubs are a separate package)
ignore_missing_imports = true
